name: Website

# A new release updates the data behind the download page, the release notes
# and the /download/* short links. The commit this job makes is what Cloudflare
# Pages builds, so the site never fetches GitHub's API at build time.
#
# Publishing a release fires this run at once, and the files are uploaded by
# the Release workflow over the following minutes: a release published before
# its build finished lands here with no assets. That is a skip, not a failure;
# release.yml dispatches this workflow again once the uploads are done.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; empty takes the latest release
        required: false

permissions:
  contents: write

concurrency:
  group: website-release-data
  cancel-in-progress: false

jobs:
  release-data:
    name: Update the release data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read the release
        env:
          GH_TOKEN: ${{ github.token }}
          # A manual run, with no release payload, takes its tag input and
          # otherwise the latest release.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="${TAG:-$(gh release view --json tagName -q .tagName)}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
      - name: Write data/release.json and the short links
        run: |
          go run website/scripts/release/main.go \
            "$RUNNER_TEMP/release.json" \
            website/data/release.json \
            website/static/_redirects
      - name: Commit when something changed
        run: |
          if git diff --quiet -- website/data/release.json website/static/_redirects; then
            echo "the site already points at this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/release.json website/static/_redirects
          git commit -m "website: release data"
          git push
