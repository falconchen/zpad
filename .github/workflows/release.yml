name: Release

# A tag you push builds the apps and puts them in a draft release, which you
# review and publish. macOS apps are signed ad hoc, which Gatekeeper blocks on
# other Macs, and the Windows apps have no signature, which SmartScreen warns
# about. Installed apps update themselves from the release's signed update
# files, so publish it as the latest release: the manifests are fetched from
# releases/latest/download/. The manifests are uploaded last, once their
# archives and deltas are there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  draft:
    name: Draft release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag names the configured version
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match $want in mygo.json"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun of the tag keeps the draft, and its files are replaced.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

  macos:
    name: macOS
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test on the platform the app ships
        run: go test ./...
      - name: Build the app, the disk images and the update
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Name the artifacts
        run: |
          v=$(jq -r .version mygo.json)
          mkdir -p build/release
          for arch in arm64 amd64; do
            test -f "build/darwin-$arch/zpad-$v-$arch.dmg"
            mv "build/darwin-$arch/zpad-$v-$arch.dmg" \
              "build/release/ZPad-$v-macos-$arch.dmg"
            ditto -c -k --keepParent "build/darwin-$arch/ZPad.app" \
              "build/release/ZPad-$v-macos-$arch.zip"
          done
      - name: Upload the disk images and the app bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
      - name: Upload the signed updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version mygo.json)
          shopt -s nullglob
          # Archives and deltas first: the manifests name them, and an app
          # that reads a manifest before its files are there gets a 404.
          files=(build/darwin-*/zpad-$v-*.tar.gz build/darwin-*/zpad-*-to-$v-*.delta)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no update files were built: is MYGO_UPDATER_PRIVATE_KEY set?"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release upload "$GITHUB_REF_NAME" \
            build/darwin-*/update-darwin-*.json --clobber

  windows:
    name: Windows
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build the app, the installer and the update
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64
      - name: Name the artifacts
        run: |
          v=$(jq -r .version mygo.json)
          test -f build/windows-amd64/ZPad.exe
          test -f "build/windows-amd64/zpad-setup-$v-amd64.exe"
          mkdir -p build/release
          # The installer ships as it is: a zip of it would only hide it.
          mv "build/windows-amd64/zpad-setup-$v-amd64.exe" \
            "build/release/ZPad-$v-windows-amd64-setup.exe"
          cd build
          # The portable app, without the updater's file list, which a
          # portable app has none of, nor the update's files. The installer
          # was moved out above.
          rm -rf ZPad
          cp -a windows-amd64 ZPad
          rm -f ZPad/.mygo-files ZPad/install.ps1
          rm -f ZPad/zpad-*.tar.gz ZPad/*.delta ZPad/update-*.json
          zip -qr "release/ZPad-$v-windows-amd64-portable.zip" ZPad
      - name: Upload the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
      - name: Upload the signed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version mygo.json)
          shopt -s nullglob
          files=(build/windows-amd64/zpad-$v-windows-amd64.tar.gz \
                 build/windows-amd64/zpad-*-to-$v-windows-amd64.delta)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no update files were built: is MYGO_UPDATER_PRIVATE_KEY set?"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release upload "$GITHUB_REF_NAME" \
            build/windows-amd64/update-windows-amd64.json --clobber
