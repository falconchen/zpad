name: Release

# A tag you push builds the apps and puts them in a draft release, which you
# review and publish. Nothing is signed and nothing updates itself: macOS apps
# are signed ad hoc, which Gatekeeper blocks on other Macs, and the Windows
# apps have no signature, which SmartScreen warns about.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  draft:
    name: Draft release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag names the configured version
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match $want in mygo.json"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun of the tag keeps the draft, and its files are replaced.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

  macos:
    name: macOS
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test on the platform the app ships
        run: go test ./...
      - name: Build the app and the disk images
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Name the artifacts
        run: |
          v=$(jq -r .version mygo.json)
          mkdir -p build/release
          for arch in arm64 amd64; do
            test -f "build/darwin-$arch/zpad-$v-$arch.dmg"
            mv "build/darwin-$arch/zpad-$v-$arch.dmg" \
              "build/release/ZPad-$v-macos-$arch.dmg"
            ditto -c -k --keepParent "build/darwin-$arch/ZPad.app" \
              "build/release/ZPad-$v-macos-$arch.zip"
          done
      - name: Upload the disk images and the app bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/release/* --clobber

  windows:
    name: Windows
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build the app and the installer
        run: go tool mygo build -platform windows/amd64
      - name: Name the artifacts
        run: |
          v=$(jq -r .version mygo.json)
          test -f build/windows-amd64/ZPad.exe
          test -f "build/windows-amd64/zpad-setup-$v-amd64.exe"
          mkdir -p build/release
          # The installer ships as it is: a zip of it would only hide it.
          mv "build/windows-amd64/zpad-setup-$v-amd64.exe" \
            "build/release/ZPad-$v-windows-amd64-setup.exe"
          cd build
          # The portable app, without the updater's file list, which a
          # portable app has none of. The installer was moved out above.
          rm -rf ZPad
          cp -a windows-amd64 ZPad
          rm -f ZPad/.mygo-files
          zip -qr "release/ZPad-$v-windows-amd64-portable.zip" ZPad
      - name: Upload the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
